global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: portfolio

rule_files:
  - /etc/prometheus/rules/portfolio.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
