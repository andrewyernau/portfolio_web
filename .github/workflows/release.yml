name: Publish immutable images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Verify source before publishing
        run: bun run check
      - name: Normalize image namespace
        id: names
        shell: bash
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.names.outputs.repository }}-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and publish API
        id: api-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.names.outputs.repository }}-api
          subject-digest: ${{ steps.api-build.outputs.digest }}
          push-to-registry: true

      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.names.outputs.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and publish web
        id: web-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.names.outputs.repository }}-web
          subject-digest: ${{ steps.web-build.outputs.digest }}
          push-to-registry: true

# Deployment intentionally stops here. A provider, TLS boundary, domain,
# environment protection policy, and secret delivery mechanism must be chosen
# before a deployment workflow can be honest and reviewable.

