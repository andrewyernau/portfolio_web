upstream portfolio_api {
    server api:3000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 64k;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Observability stays on the private Compose network.
    location = /metrics { return 404; }
    location = /api/metrics { return 404; }
    location ^~ /metrics/ { return 404; }

    location = /api/v1/contact {
        limit_req zone=contact burst=3 nodelay;
        proxy_pass http://portfolio_api;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location = /api/v1/analytics/pageviews {
        limit_req zone=visits burst=10 nodelay;
        proxy_pass http://portfolio_api;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location ^~ /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://portfolio_api;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
