upstream portfolio_api {
    server api:3000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 64k;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Observability and health stay on the private Compose network.
    location = /metrics { return 404; }
    location ^~ /metrics/ { return 404; }
    location ^~ /api/ { return 404; }

    # File names carry the version, so these never change.
    location ^~ /static/vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /static/ {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /main.pdf {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 503 rather than 429: htmx swaps the application's own 429 into the form,
    # and this response has no form to swap in.
    location ~ ^/(es/contacto|en/contact)$ {
        limit_req zone=contact burst=3 nodelay;
        limit_req_status 503;
        proxy_pass http://portfolio_api;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location / {
        limit_req zone=pages burst=40 nodelay;
        proxy_pass http://portfolio_api;
        include /etc/nginx/snippets/proxy-api.conf;
    }
}
