worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Deliberately excludes client IP, query strings, referrers, and user agents.
    log_format privacy '$time_iso8601 method=$request_method path=$uri '
                       'status=$status bytes=$body_bytes_sent duration=$request_time';
    access_log /var/log/nginx/access.log privacy;
    error_log /var/log/nginx/error.log warn;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_body_timeout 10s;
    client_header_timeout 10s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=visits:10m rate=30r/m;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    include /etc/nginx/conf.d/*.conf;
}

